<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="icon" href="logo.png" type="image/png">
  <title>Tambah Data Mahasiswa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    #navbar {
      min-height: 8vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px 0 15px;
    }

    #bagianKiri {
      margin-left: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #bagianKiri>p {
      font-size: 20px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      user-select: none;
    }

    #bagianKiri>img {
      pointer-events: none;
      user-select: none;
    }

    #bagianKanan {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .aNavbar {
      font-size: 20px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      text-decoration: none;
      color: black;
      padding: 5px;
      border-radius: 10px;
    }

    .aNavbar:hover {
      color: #2196f3;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 43px;
      left: -70px;
      background-color: white;
      min-width: 130px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 5px;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 18px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .dropdown-content a:hover {
      color: #2196f3;
    }

    /* Halaman Tambah Data */
    #tambahData {
      min-height: 92vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd 0%, #f0f0f0 100%);
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.8);
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 400px;
      backdrop-filter: blur(10px);
    }

    .form-card h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #2196f3;
      outline: none;
      box-shadow: 0 0 5px rgba(33, 150, 243, 0.5);
    }

    .btn-submit {
      background: linear-gradient(45deg, #2196f3, #21cbf3);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 30px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .success-message {
      display: none;
      color: green;
      font-size: 1.1rem;
      margin-top: 15px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .form-card {
        width: 90%;
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <div id="navbar">
    <div id="bagianKiri">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Logo Data Mahasiswa" width="30">
      <p>Data Mahasiswa</p>
    </div>

    <div id="bagianKanan">
      <a href="index.html" class="aNavbar">Beranda</a>
      <div class="dropdown">
        <a href="#" class="aNavbar">Fitur</a>
        <div class="dropdown-content">
          <a href="tambah.html">Tambah Data</a>
          <a href="lihat.html">Lihat Data</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Halaman Tambah Data -->
  <div id="tambahData">
    <div class="form-card">
      <h2>Tambah Data Mahasiswa</h2>
      <div class="input-group">
        <label>Nama Mahasiswa</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap">
      </div>
      <div class="input-group">
        <label>NIM</label>
        <input type="text" id="nim" placeholder="Masukkan NIM">
      </div>
      <div class="input-group">
        <label>Program Studi</label>
        <input type="text" id="prodi" placeholder="Masukkan Program Studi">
      </div>
      <div class="input-group">
        <label>Kelas</label>
        <input type="text" id="kelas" placeholder="Masukkan 1 huruf (contoh: A)">
      </div>
      <button class="btn-submit" id="btnSimpan">Simpan Data</button>
      <div class="success-message" id="successMsg">✅ Data berhasil disimpan!</div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      // Dropdown toggle
      $('.dropdown > a').click(function (e) {
        e.preventDefault();
        $(this).next('.dropdown-content').toggle();
      });

      $(document).click(function (e) {
        if (!$(e.target).closest('.dropdown').length) {
          $('.dropdown-content').hide();
        }
      });

      // Validasi input real-time
      $('#nama, #prodi').on('input', function () {
        this.value = this.value.replace(/[^a-zA-Z\s]/g, ''); // hanya huruf dan spasi
      });

      $('#nim').on('input', function () {
        this.value = this.value.replace(/[^0-9]/g, ''); // hanya angka
      });

      $('#kelas').on('input', function () {
        this.value = this.value.replace(/[^A-Za-z]/g, '').toUpperCase(); // hanya huruf, otomatis kapital
        if (this.value.length > 1) this.value = this.value.slice(0, 1); // hanya 1 huruf
      });

      // Tombol simpan
      $('#btnSimpan').click(function () {
        let nama = $('#nama').val().trim();
        let nim = $('#nim').val().trim();
        let prodi = $('#prodi').val().trim();
        let kelas = $('#kelas').val().trim();

        if (nama === "" || nim === "" || prodi === "" || kelas === "") {
          alert("⚠️ Harap isi semua data sebelum menyimpan!");
          return;
        }

        let data = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];
        data.push({ nama, nim, prodi, kelas });
        localStorage.setItem('dataMahasiswa', JSON.stringify(data));

        $('#successMsg').fadeIn(300).delay(1500).fadeOut(400);
        $('input').val('');
      });
    });
  </script>
</body>

</html>
