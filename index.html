<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="icon" href="logo.png" type="image/png">
    <title>Data Mahasiswa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            overflow: hidden;
        }

        #navbar {
            min-height: 8vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px 0 15px;
        }

        #bagianKiri {
            margin-left: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #bagianKiri>p {
            font-size: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            user-select: none;
        }

        #bagianKiri>img {
            pointer-events: none;
            user-select: none;
        }

        #bagianKanan {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .aNavbar {
            font-size: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-decoration: none;
            color: black;
            padding: 5px;
            border-radius: 10px;
        }

        .aNavbar:hover {
            color: #2196f3;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 43px;
            left: -70px;
            background-color: linear-gradient(45deg, #2196f3, #21cbf3);
            min-width: 130px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .dropdown-content a:hover {
            color: #2196f3;
        }

        #beranda {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd 0%, #f0f0f0 100%);
            padding: 20px;
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #beranda h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #beranda p {
            font-size: 1.2rem;
            color: #666;
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .tombol-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tombol {
            background: linear-gradient(45deg, #2196f3, #21cbf3);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .tombol:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .tombol:active {
            transform: translateY(0);
        }

        /* Responsivitas */
        @media (max-width: 768px) {
            #beranda h1 {
                font-size: 2.5rem;
            }

            #beranda p {
                font-size: 1rem;
            }

            .tombol-container {
                flex-direction: column;
                align-items: center;
            }

            .tombol {
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar">
        <div id="bagianKiri">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Logo Data Mahasiswa" width="30">
            <p>Data Mahasiswa</p>
        </div>

        <div id="bagianKanan">
            <a href="index.html" class="aNavbar">Beranda</a>
            <div class="dropdown">
                <a href="#" class="aNavbar">Fitur</a>
                <div class="dropdown-content">
                    <a href="tambah.html">Tambah Data</a>
                    <a href="lihat.html">Lihat Data</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Isi Halaman Beranda -->
    <div id="beranda">
        <h1>Selamat Datang di Data Mahasiswa</h1>
        <p>Aplikasi ini dirancang untuk mengelola data mahasiswa dengan mudah dan efisien. Tambahkan data baru atau
            lihat data yang sudah ada untuk memudahkan administrasi akademik Anda.</p>
        <div class="tombol-container">
            <button class="tombol" id="tambahDataBtn">Tambah Data</button>
            <button class="tombol" id="lihatDataBtn">Lihat Data</button>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('.dropdown > a').click(function (e) {
                e.preventDefault();
                $(this).next('.dropdown-content').toggle();
            });

            $(document).click(function (e) {
                if (!$(e.target).closest('.dropdown').length) {
                    $('.dropdown-content').hide();
                }
            });

            $('#tambahDataBtn').click(function () {
                window.location.href = 'tambah.html';
            });

            $('#lihatDataBtn').click(function () {
                window.location.href = 'lihat.html';
            });

        });
    </script>
</body>

</html>
